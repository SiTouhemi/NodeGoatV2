{% extends "./layout.html" %}
{% block title %}Learning Roadmap{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-12">
        <div class="panel panel-success">
            <div class="panel-heading">
                <h3 class="panel-title"><i class="fa fa-road"></i> Cyber security learning roadmap</h3>
            </div>
            <div class="panel-body">
                <div class="timeline">
                    {% for item in roadmap %}
                    <div class="panel panel-default" style="margin-bottom: 18px;">
                        <div class="panel-heading">
                            <strong>{{ item.phase }}</strong>
                            <span class="label label-primary" style="margin-left: 10px;">{{ item.completion }}</span>
                        </div>
                        <div class="panel-body">
                            <h4>{{ item.title }}</h4>
                            <p>{{ item.summary }}</p>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
